gitUserId: adyen
gitRepoId: adyen-go-api-library/v21/src
structPrefix: true
isGoSubmodule: true
additionalProperties:
  useOneOfDiscriminatorLookup: true
  # Keep the v21 service type names (generator 7 defaults to the "API" suffix).
  apiNameSuffix: Api
  # Avoid colliding constants when two enums in one package share values.
  enumClassPrefix: true
  # Absent additionalProperties means "not allowed", as with generator 6.
  disallowAdditionalPropertiesIfNotPresent: true
typeMappings:
  AnyType: any
  object: map[string]any
files:
  # Rendered only for webhook services; adyen-sdk-automation selects the supporting file per
  # service (GoServiceLayout.supportingFile).
  webhook_handler.mustache:
    destinationFilename: webhook_handler.go
    templateType: SupportingFiles
